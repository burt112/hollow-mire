<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hollow Mire</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:monospace;color:#bbb;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.stick{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;border:2px solid #fff3;background:#ffffff0d;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:#fff4;transform:translate(-50%,-50%)}
#L{left:24px}#R{right:24px}
#use{position:fixed;right:40px;bottom:190px;width:84px;height:84px;border-radius:50%;border:2px solid #fff5;background:#0008;color:#fff;font:bold 13px monospace;touch-action:none}
#use.on{border-color:#4fd1ff;box-shadow:0 0 16px #4fd1ff88}
#atk{position:fixed;right:178px;bottom:44px;width:84px;height:84px;border-radius:50%;border:2px solid #fff6;background:#400a;color:#fff;font:bold 13px monospace;touch-action:none}
#atk:active{background:#a22b}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);color:#e8d8a0;font-size:15px;text-shadow:0 0 6px #000;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#hud{position:fixed;top:10px;left:12px;font-size:13px;text-shadow:0 0 4px #000;pointer-events:none}
#hpw{position:fixed;top:32px;left:12px;display:flex;align-items:center;gap:6px;pointer-events:none}
#hpi{color:#e23;font-size:18px;text-shadow:0 0 4px #000}
#hpb{width:130px;height:14px;border:2px solid #fff6;background:#000a;padding:1px}
#hpf{height:100%;width:100%;background:#3c3;transition:width .15s}
#hpt{font-size:12px;text-shadow:0 0 4px #000;color:#ddd}
#hpw.hit{animation:hit .4s}@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#hpw.low #hpf{animation:pulse .6s infinite alternate}@keyframes pulse{to{opacity:.35}}
#mm{position:fixed;top:10px;right:10px;width:110px;height:110px;border:2px solid #fff4;background:#0b111b;image-rendering:pixelated;z-index:5;touch-action:none}
#mm.big{top:50%;right:auto;left:50%;transform:translate(-50%,-50%);width:min(78vh,90vw);height:min(78vh,90vw)}
#menu{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;z-index:9}
#menu h1{color:#a22;letter-spacing:6px;margin:0 0 4px}
#menu p{margin:0 0 6px;font-size:12px;color:#888;text-align:center;max-width:270px;line-height:1.4}
#menu button,#menu input{font:16px monospace;padding:12px 18px;background:#111;color:#ddd;border:1px solid #555;width:240px;text-align:center;user-select:text;-webkit-user-select:text}
#menu button:active{background:#400}
#msg{color:#c55;min-height:18px}
</style></head><body>
<canvas id="c"></canvas>
<canvas id="mm"></canvas>
<div id="hud"></div>
<div id="hpw"><span id="hpi">&#9829;</span><div id="hpb"><div id="hpf"></div></div><span id="hpt">100</span></div>
<div class="stick" id="L"><i></i></div>
<div class="stick" id="R"><i></i></div>
<button id="use">POWER</button>
<button id="atk">SWORD</button>
<div id="toast"></div>
<div id="menu">
  <h1>HOLLOW MIRE</h1>
  <p>Fight back with the SWORD button (or tap the right stick). Small monsters die in a few hits; the big creature flees when beaten. Red crosses heal. Campfires and your cabin are safe zones. Tap the map to enlarge.</p>
  <input id="name" placeholder="your name" maxlength="12">
  <button id="solo">Single player</button>
  <button id="create">Create room</button>
  <input id="code" placeholder="room code" maxlength="8" style="text-transform:uppercase">
  <button id="join">Join room</button>
  <div id="msg"></div>
</div>
<script type="module">

const $ = (id) => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), dk = document.createElement('canvas'), dctx = dk.getContext('2d');

  const SL = Stick($('L')), SR = Stick($('R'), () => { atkQ = true; });
const keys = {}; let mouse = null, useQ = false, atkQ = false, atkHeld = false;
addEventListener('keydown', (e) => { keys[e.code] = 1; if (e.code === 'Space' || e.code === 'KeyE') useQ = true; if (e.code === 'KeyJ' || e.code === 'KeyF') atkQ = true; if (e.code === 'KeyM') $('mm').classList.toggle('big'); });

addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') mouse = { x: e.clientX - innerWidth / 2, y: e.clientY - innerHeight / 2 }; });

addEventListener('pointerup', (e) => { if (e.pointerType === 'mouse') atkHeld = false; });
$('use').addEventListener('pointerdown', (e) => { e.preventDefault(); useQ = true; });
$('atk').addEventListener('pointerdown', (e) => { e.preventDefault(); atkHeld = true; atkQ = true; });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) $('atk').addEventListener(ev, () => { atkHeld = false; });
$('mm').addEventListener('pointerdown', (e) => { e.preventDefault(); $('mm').classList.toggle('big'); });

}

// ---------- game state ----------

    if (e.k === 'heal') { healT = 0.7; tone(520, 1040, 0.35, 0.25); }
    if (e.k === 'pick') noise(0.15, 0.2, 1500, 3000);

}
  function setPlayer(id, x, y, aim, item, dead, fx, name, hp, inv, sw, kills, snap) {

  p.tx = x; p.ty = y; p.aim = aim; p.item = item; p.dead = dead; p.fx = fx; p.name = name; p.hp = hp; p.inv = inv; p.kills = kills;

}
function setEnemies(list, snap) {

      view.m.tx = m.m[0]; view.m.ty = m.m[1]; view.m.chase = m.m[2]; view.m.dazed = m.m[3]; view.m.away = m.m[4];

$('solo').onclick = startSolo;
$('create').onclick = async () => { const { code } = await (await fetch('/api/new')).json(); startOnline(code); };
$('join').onclick = () => { const c = $('code').value.trim(); if (c) startOnline(c); };
setInterval(() => { if (ws && ws.readyState === 1) { const i = readInput(); ws.send(JSON.stringify({ t: 'in', ...i })); useQ = false; atkQ = false; } }, 50);

// ---------- minimap ----------
const mm = $('mm'), mctx = mm.getContext('2d'); mm.width = W; mm.height = H;
const mapc = document.createElement('canvas'); mapc.width = W; mapc.height = H; const mapx = mapc.getContext('2d');

  function drawScare() {

// ---------- main loop ----------
let last = performance.now(), uiT = 0;

  const mp = view.players[me]; if (!mp) return;
  reveal(mp.x, mp.y);
  const time = now / 1000, shk = (scare.t > 0 && scare.big ? 3 : 0) + (hurtT > 0 ? 5 : 0);
  const cx = Math.round(mp.x - VW / 2 + (Math.random() - 0.5) * shk), cy = Math.round(mp.y - VH / 2 + (Math.random() - 0.5) * shk);
  const inView = (x, y, r) => x + r > cx && x - r < cx + VW && y + r > cy && y - r < cy + VH;
  const md = view.m.away ? 9999 : Math.hypot(view.m.x - mp.x, view.m.y - mp.y);
  const players = Object.values(view.players).filter((p) => !p.dead);
  const tx0 = Math.floor(cx / T) - 1, tx1 = Math.floor((cx + VW) / T) + 1, ty0 = Math.floor(cy / T) - 2, ty1 = Math.floor((cy + VH) / T) + 2;
  const tileAt = (tx, ty) => (tx < 0 || ty < 0 || tx >= W || ty >= H ? 1 : world.tiles[ty * W + tx]);

  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) A.drawTile(tileAt(tx, ty), tx, ty, tx * T - cx, ty * T - cy, time, world.seed);
  const vl = world.lights.filter((l) => inView(l.x, l.y, l.r));
  for (const l of vl) if (!l.in && !l.fire && inView(l.x, l.y, 10)) { const x = Math.round(l.x - cx), y = Math.round(l.y - cy); R('#1a1a1a', x - 1, y - 6, 2, 9); R('#ffd890', x - 2, y - 9, 4, 3); }
  world.pickups.forEach((pk, n) => {
    if (!view.k[n] || !inView(pk.x, pk.y, 10)) return;
    const x = Math.round(pk.x - cx), y = Math.round(pk.y - cy + Math.sin(time * 3 + n) * 1.5);
    if (pk.type === 'med') { R('#00000055', x - 5, y + 4, 10, 2); R('#e8e8e8', x - 4, y - 4, 9, 9); R('#d02828', x - 1, y - 3, 3, 7); R('#d02828', x - 3, y - 1, 7, 3); }
    else if (pk.type === 'dash') { R('#4fd1ff', x - 1, y - 4, 3, 9); R('#4fd1ff', x - 4, y - 1, 9, 3); }
    else { R('#ffd84f', x, y - 5, 3, 5); R('#ffd84f', x - 2, y - 1, 5, 2); R('#ffd84f', x - 1, y + 1, 3, 5); }
  });
  players.slice().sort((a, b) => a.y - b.y).forEach((p) => A.drawPlayer(p, Math.round(p.x - cx), Math.round(p.y - cy), p.id === me));
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) if (tileAt(tx, ty) === 1) A.canopy(tx, ty, tx * T - cx, ty * T - cy);

  // moonlit darkness with light cut-outs
  const flick = md < 90 && Math.random() < 0.25 ? 0.5 : 1;
  dctx.globalCompositeOperation = 'source-over'; dctx.fillStyle = 'rgba(4,7,24,0.5)'; dctx.fillRect(0, 0, VW, VH);
  dctx.globalCompositeOperation = 'destination-out';
  for (const l of vl) glow(dctx, l.x - cx, l.y - cy, l.r * (1 + (l.fire ? 0.06 : 0.03) * Math.sin(time * (l.fire ? 9 : 3) + l.x)), 0.8, '0,0,0');
  for (const p of players) { const x = p.x - cx, y = p.y - cy; glow(dctx, x, y, 34, 0.45, '0,0,0'); cone(dctx, x, y, p.aim, 0.72, 95, 0.4, '0,0,0'); cone(dctx, x, y, p.aim, 0.42, 140, flick, '0,0,0'); }
  ctx.drawImage(dk, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  for (const l of vl) glow(ctx, l.x - cx, l.y - cy, l.r, l.in ? 0.1 : l.fire ? 0.22 : 0.16, '255,190,90');
  world.pickups.forEach((pk, n) => { if (view.k[n] && inView(pk.x, pk.y, 14)) glow(ctx, pk.x - cx, pk.y - cy, 14, 0.3, pk.type === 'med' ? '255,80,80' : pk.type === 'dash' ? '79,209,255' : '255,216,79'); });
  for (const p of players) cone(ctx, p.x - cx, p.y - cy, p.aim, 0.42, 140, 0.13 * flick, '255,235,170');
  world.swarms.forEach((s, i) => {
    if (!inView(s.x, s.y, s.r + 8)) return;
    for (let j = 0; j < 4; j++) {
      const a = i * 1.7 + j * 2.3, fx = s.x - cx + Math.sin(time * (0.5 + j * 0.13) + a) * s.r, fy = s.y - cy + Math.cos(time * (0.6 + j * 0.11) + a * 1.3) * s.r * 0.7;
      const b = Math.max(0, Math.sin(time * 2.2 + a * 3)); if (b < 0.05) continue;
      glow(ctx, fx, fy, 5, 0.4 * b, '200,255,120'); ctx.fillStyle = `rgba(235,255,170,${0.4 + 0.6 * b})`; ctx.fillRect(Math.round(fx), Math.round(fy), 1, 1);
    }
  });
  ctx.strokeStyle = 'rgba(255,180,90,0.16)'; ctx.setLineDash([3, 4]);
  for (const z of world.safe) if (z.r < 90 && inView(z.x, z.y, z.r)) { ctx.beginPath(); ctx.arc(z.x - cx, z.y - cy, z.r, 0, 6.283); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.globalCompositeOperation = 'source-over';

  // creatures are only seen by flashlight, lamp / fire light, or when very close. Unlit ones show glowing eyes when near.
  const isLit = (x, y) => {
    for (const p of players) { const dx = x - p.x, dy = y - p.y, d = Math.hypot(dx, dy); if (d < 26) return true; if (d < 140) { let da = Math.atan2(dy, dx) - p.aim; da = Math.atan2(Math.sin(da), Math.cos(da)); if (Math.abs(da) < 0.46) return true; } }
    for (const l of vl) if (Math.hypot(x - l.x, y - l.y) < l.r * 0.55) return true;
        return false;
  };
  const list = Object.values(view.e); list.push({ boss: 1, x: view.m.x, y: view.m.y });
  list.sort((a, b) => a.y - b.y);
  for (const e of list) {
    if (e.boss) {
      if (view.m.away) continue;
      view.m.vis = Math.max(0, Math.min(1, view.m.vis + (isLit(e.x, e.y) ? 1 : -1) * dt * 6));
      const mx = Math.round(e.x - cx), my = Math.round(e.y - cy);
      if (view.m.vis > 0.02) { A.drawMonster(mx, my, time, view.m.vis); if (view.m.dazed && Math.sin(time * 40) > 0) { ctx.globalAlpha = 0.5; R('#fff', mx - 6, my - 20, 13, 28); ctx.globalAlpha = 1; } }
      else if (md < 150 && Math.random() > 0.08) { R('#ff2020', mx - 3, my - 19, 2, 2); R('#ff2020', mx + 1, my - 19, 2, 2); R('#ff202033', mx - 5, my - 20, 10, 4); }
      continue;
    }
    const sx = Math.round(e.x - cx), sy = Math.round(e.y - cy); if (sx < -20 || sy < -30 || sx > VW + 20 || sy > VH + 20) continue;
    e.vis = Math.max(0, Math.min(1, (e.vis ?? 0) + ((e.kind === 3 || isLit(e.x, e.y)) ? 1 : -1) * dt * 7));
    if (e.vis > 0.03) A.drawEnemy(e.kind, sx, sy, time, e.vis, e.fl & 1, e.fl & 2, e.ph);
    else if (Math.hypot(e.x - mp.x, e.y - mp.y) < 110 && Math.random() > 0.1) A.drawEyes(e.kind, sx, sy);
  }
  for (const f of view.fx) { // hit sparks and death puffs
    const x = Math.round(f.x - cx), y = Math.round(f.y - cy), r = (1 - f.t / (f.kill ? 0.5 : 0.3)) * (f.big ? 14 : 9);
    for (let i = 0; i < 8; i++) { const a = i * 0.785 + f.x; R(f.kill ? '#ffe9a0' : '#ffffff', Math.round(x + Math.cos(a) * r), Math.round(y - 4 + Math.sin(a) * r), 2, 2); }
  }

  // mist + vignette + damage / heal feedback
  for (let i = 0; i < 4; i++) { const fx = (((i * 97 + time * (4 + i) - cx * 0.4) % (VW + 160)) + VW + 160) % (VW + 160) - 80, fy = 30 + i * 36 + Math.sin(time * 0.3 + i) * 10; glow(ctx, fx, fy, 70, 0.04, '150,170,190'); }
  const vg = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.4, VW / 2, VH / 2, VH * 0.95); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.42)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
  if (md < 170 && mp.hp > 0) { const a = (1 - md / 170) * (0.12 + 0.05 * Math.sin(time * 8)), rg = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.35, VW / 2, VH / 2, VH); rg.addColorStop(0, 'rgba(90,0,0,0)'); rg.addColorStop(1, `rgba(90,0,0,${a * 2})`); ctx.fillStyle = rg; ctx.fillRect(0, 0, VW, VH); }
  if (hurtT > 0) { ctx.fillStyle = `rgba(210,0,0,${Math.min(0.55, hurtT)})`; ctx.fillRect(0, 0, VW, VH); }
  if (healT > 0) { ctx.fillStyle = `rgba(80,255,120,${healT * 0.25})`; ctx.fillRect(0, 0, VW, VH); }
  if (caught > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, caught)})`; ctx.fillRect(0, 0, VW, VH); }
  drawScare();

  hbT -= dt; if (md < 170 && hbT <= 0 && mp.hp > 0) { thump(0.3 + (1 - md / 170) * 0.5); setTimeout(() => thump(0.2), 150); hbT = 0.35 + md / 170 * 1.2; }
  growlT -= dt; if (growlT <= 0) { noise(1.5, 0.12, 220, 60); growlT = 20 + Math.random() * 25; }

  mmT -= dt; if (mmT <= 0) { mmT = 0.1; drawMap(now, time, md); }
  uiT -= dt; if (uiT <= 0) {
    uiT = 0.1; const n = Object.keys(view.players).length, hp = Math.max(0, mp.hp), f = $('hpf');
    $('hud').textContent = (room ? `ROOM ${room}  ·  ${n} player${n > 1 ? 's' : ''}` : 'SINGLE PLAYER') + `  ·  KILLS ${mp.kills || 0}` + (mp.dead ? '  ·  YOU WERE TAKEN…' : '');
    f.style.width = (hp / MAXHP * 100) + '%'; f.style.background = hp > 60 ? '#3c3' : hp > 30 ? '#ea3' : '#e33';
    $('hpt').textContent = hp; $('hpw').classList.toggle('low', hp > 0 && hp <= 30);
    $('use').textContent = mp.item ? mp.item.toUpperCase() : '—'; $('use').classList.toggle('on', !!mp.item);
  }
}
requestAnimationFrame(frame);
</script></body></html>
