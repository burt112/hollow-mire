<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hollow Mire</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}

#L{left:24px}#R{right:24px}

#use.on{border-color:#4fd1ff;box-shadow:0 0 16px #4fd1ff88}

#menu button,#menu input{font:16px monospace;padding:12px 18px;background:#111;color:#ddd;border:1px solid #555;width:240px;text-align:center;user-select:text;-webkit-user-select:text}
#menu button:active{background:#400}
#msg{color:#c55;min-height:18px}
</style></head><body>
<canvas id="c"></canvas>
<canvas id="mm"></canvas>
<div id="hud"></div>
<div class="stick" id="L"><i></i></div>
<div class="stick" id="R"><i></i></div>
<button id="use">POWER</button>
<div id="menu">
  <h1>HOLLOW MIRE</h1>
  <p>Follow the roads. Lamps are safe light. Your flashlight reveals the creature. Tap the map to enlarge it.</p>
  <input id="name" placeholder="your name" maxlength="12">
  <button id="solo">Single player</button>
  <button id="create">Create room</button>
  <input id="code" placeholder="room code" maxlength="8" style="text-transform:uppercase">
  <button id="join">Join room</button>
  <div id="msg"></div>
</div>
<script type="module">
import { T, W, H, hash, createWorld, newState, addPlayer, step } from './sim.js';
const $ = (id) => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), dk = document.createElement('canvas'), dctx = dk.getContext('2d');
let VW = 320; const VH = 180;
function resize() { VW = Math.round(VH * innerWidth / innerHeight); cv.width = dk.width = VW; cv.height = dk.height = VH; }
addEventListener('resize', resize); resize();

// ---------- input ----------
function Stick(el) {

  const end = (e) => { if (e.pointerId === pid) { pid = null; v.x = v.y = 0; knob.style.transform = 'translate(-50%,-50%)'; } };

}
const SL = Stick($('L')), SR = Stick($('R'));
const keys = {}; let mouse = null, useQ = false;
addEventListener('keydown', (e) => { keys[e.code] = 1; if (e.code === 'Space' || e.code === 'KeyE') useQ = true; if (e.code === 'KeyM') $('mm').classList.toggle('big'); });

addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') mouse = { x: e.clientX - innerWidth / 2, y: e.clientY - innerHeight / 2 }; });
$('use').addEventListener('pointerdown', (e) => { e.preventDefault(); useQ = true; });
$('mm').addEventListener('pointerdown', (e) => { e.preventDefault(); $('mm').classList.toggle('big'); });
function readInput() {
  let mx = SL.x, my = SL.y;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyW || keys.ArrowUp) my -= 1; if (keys.KeyS || keys.ArrowDown) my += 1;
  let ax = SR.x, ay = SR.y;
  if (Math.hypot(ax, ay) < 0.2) {
    if (mouse) { const l = Math.hypot(mouse.x, mouse.y) || 1; ax = mouse.x / l; ay = mouse.y / l; }
    else if (Math.hypot(mx, my) > 0.3) { ax = mx; ay = my; } // flashlight follows movement when right stick idle

}

// ---------- audio ----------
let ac, hbT = 0, growlT = 20;
function audio() {

  const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 42; g.gain.value = 0.04; o.connect(g).connect(ac.destination); o.start();
  const n = ac.sampleRate * 2, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0); let l = 0;
  for (let i = 0; i < n; i++) { l = (l + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = l * 3.5; }
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), wg = ac.createGain(); s.buffer = b; s.loop = true; f.type = 'lowpass'; f.frequency.value = 500; wg.gain.value = 0.35;
  s.connect(f).connect(wg).connect(ac.destination); s.start();
}
function noise(dur, vol, f0, f1) {
  if (!ac) return; const n = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter(); s.buffer = b; f.type = 'bandpass';
  f.frequency.setValueAtTime(f0, ac.currentTime); f.frequency.exponentialRampToValueAtTime(f1, ac.currentTime + dur);
  g.gain.value = vol; s.connect(f).connect(g).connect(ac.destination); s.start();
}
const thump = (v) => { if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 55; g.gain.setValueAtTime(v, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.25); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.3); };

// ---------- game state ----------
let world, local = null, ws = null, me = null, room = '';
const view = { players: {}, m: { x: 0, y: 0, vis: 0 }, k: [] };
let scare = { t: 0, big: 0, max: 1 }, caught = 0;
let seen = null, mapDirty = true, mapBuilt = 0, mmT = 0;

function onEvents(evs) {
  for (const e of evs) {
    if (e.id !== me) continue;
    if (e.k === 'scare') { scare = { t: e.big ? 0.9 : 0.35, big: e.big, max: e.big ? 0.9 : 0.35 }; noise(e.big ? 0.8 : 0.3, e.big ? 0.7 : 0.25, 3000, 400); if (navigator.vibrate) navigator.vibrate(e.big ? 200 : 60); }
    if (e.k === 'caught') { caught = 3; scare = { t: 1.2, big: 1, max: 1.2 }; noise(1.2, 0.9, 5000, 200); }
    if (e.k === 'pick') noise(0.15, 0.2, 1500, 3000);
    if (e.k === 'use') noise(0.2, 0.25, 800, 2500);
  }
}
function setPlayer(id, x, y, aim, item, dead, fx, name, snap) {
  const p = view.players[id] || (view.players[id] = { x, y });
  p.tx = x; p.ty = y; p.aim = aim; p.item = item; p.dead = dead; p.fx = fx; p.name = name;
  if (snap) { p.x = x; p.y = y; }
}
function syncLocal() {
  const s = local;
  for (const p of Object.values(s.players)) setPlayer(p.id, p.x, p.y, p.aim, p.item, p.dead > 0, p.speedT > 0, p.name, true);
  view.m.x = s.m.x; view.m.y = s.m.y; view.k = s.pk.map((k) => k.on);
}
function initWorld(w) { world = w; seen = new Uint8Array(W * H); mapDirty = true; view.m.vis = 0; }

function startSolo() {
  initWorld(createWorld((Math.random() * 2 ** 31) | 0)); local = newState(world); me = 'me'; room = '';
  addPlayer(local, world, me, $('name').value || 'You'); $('menu').style.display = 'none'; audio();
}
function startOnline(code) {
  audio(); $('msg').textContent = 'connecting…'; room = code.toUpperCase();
  const sock = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/${room}?name=${encodeURIComponent($('name').value || 'Player')}`);
  sock.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'welcome') { me = m.id; initWorld(createWorld(m.seed)); ws = sock; $('menu').style.display = 'none'; }
    else if (m.t === 's') {
      const ids = new Set();
      for (const [id, x, y, aim, item, dead, fx, name] of m.p) { ids.add(id); setPlayer(id, x, y, aim, item, !!dead, !!fx, name, !view.players[id]); }
      for (const id in view.players) if (!ids.has(id)) delete view.players[id];
      view.m.tx = m.m[0]; view.m.ty = m.m[1]; if (view.m.x === 0) { view.m.x = m.m[0]; view.m.y = m.m[1]; }
      view.k = m.k.map(Boolean); onEvents(m.e);
    }
  };
  sock.onclose = () => { ws = null; world = null; local = null; $('menu').style.display = 'flex'; $('msg').textContent = 'Disconnected or room full.'; };
}
$('solo').onclick = startSolo;
$('create').onclick = async () => { const { code } = await (await fetch('/api/new')).json(); startOnline(code); };
$('join').onclick = () => { const c = $('code').value.trim(); if (c) startOnline(c); };
setInterval(() => { if (ws && ws.readyState === 1) { const i = readInput(); ws.send(JSON.stringify({ t: 'in', ...i })); useQ = false; } }, 50);

// ---------- minimap ----------
const mm = $('mm'), mctx = mm.getContext('2d'); mm.width = W; mm.height = H;
const mapc = document.createElement('canvas'); mapc.width = W; mapc.height = H; const mapx = mapc.getContext('2d');
const MC = { 0: [40, 78, 44], 1: [16, 48, 26], 2: [28, 74, 120], 3: [110, 92, 68], 4: [170, 170, 185], 5: [220, 150, 40], 6: [190, 165, 105], 7: [150, 112, 60], 8: [90, 66, 40] };
const KNOWN = { 3: 1, 4: 1, 5: 1, 6: 1, 7: 1, 8: 1 };
function reveal(px, py) {
  const cx = (px / T) | 0, cy = (py / T) | 0, R = 13;
  for (let y = cy - R; y <= cy + R; y++) for (let x = cx - R; x <= cx + R; x++) {
    if (x < 0 || y < 0 || x >= W || y >= H || (x - cx) ** 2 + (y - cy) ** 2 > R * R) continue;
    const i = y * W + x; if (!seen[i]) { seen[i] = 1; mapDirty = true; }
  }
}
function drawMap(now, time) {
  if (mapDirty && now - mapBuilt > 250) {
    const id = mapx.createImageData(W, H), d = id.data;
    for (let i = 0; i < W * H; i++) { const t = world.tiles[i]; if (seen[i] || KNOWN[t]) { const c = MC[t]; d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255; } }
    mapx.putImageData(id, 0, 0); mapDirty = false; mapBuilt = now;
  }
  mctx.clearRect(0, 0, W, H); mctx.drawImage(mapc, 0, 0);
  mctx.fillStyle = '#4fd1ff'; mctx.fillRect(world.spawn.x / T - 3, world.spawn.y / T - 3, 6, 6);
  for (const p of Object.values(view.players)) {
    if (p.dead) continue;
    mctx.fillStyle = p.id === me ? (((time * 3) | 0) % 2 ? '#fff' : '#f55') : '#6cb3d9';
    mctx.fillRect(p.x / T - 2, p.y / T - 2, 5, 5);
  }
}

// ---------- rendering ----------
const COL = { dash: '#4fd1ff', speed: '#ffd84f' };
function drawTile(t, tx, ty, sx, sy, time) {
  const h = hash(tx, ty, 5);
  if (t === 0 || t === 1) {
    ctx.fillStyle = h < 0.33 ? '#2a5a2f' : h < 0.66 ? '#2f6334' : '#356a38'; ctx.fillRect(sx, sy, T, T);
    if (h > 0.8) { ctx.fillStyle = '#4a8a4a'; ctx.fillRect(sx + ((h * 97) % 11 | 0) + 2, sy + ((h * 53) % 9 | 0) + 3, 1, 3); ctx.fillRect(sx + ((h * 61) % 9 | 0) + 4, sy + ((h * 29) % 7 | 0) + 6, 1, 2); }
    if (t === 1) {
      const o = (h * 4) | 0;
      ctx.fillStyle = '#00000044'; ctx.fillRect(sx + 1, sy + 11, 14, 4);
      ctx.fillStyle = '#4a2f1a'; ctx.fillRect(sx + 6, sy + 9, 4, 7);
      ctx.fillStyle = '#164a24'; ctx.fillRect(sx + 1, sy - 3, 14, 14); ctx.fillRect(sx - 1, sy, 18, 8);
      ctx.fillStyle = '#1f6a32'; ctx.fillRect(sx + 3, sy - 2, 10, 8);
      ctx.fillStyle = '#2e8a44'; ctx.fillRect(sx + 4 + o, sy - 1, 3, 2); ctx.fillRect(sx + 8, sy + 3, 2, 2);
    }
  } else if (t === 2) {
    ctx.fillStyle = '#1e4a78'; ctx.fillRect(sx, sy, T, T);
    if (((h * 60 + time * 1.5) | 0) % 7 === 0) { ctx.fillStyle = '#3a7ab0'; ctx.fillRect(sx + 2, sy + ((h * 12) | 0), 6, 1); }
    if (h > 0.9) { ctx.fillStyle = '#2a5a90'; ctx.fillRect(sx + 8, sy + 10, 5, 1); }
  } else if (t === 3 || t === 8) {
    ctx.fillStyle = '#6a5640'; ctx.fillRect(sx, sy, T, T);
    ctx.fillStyle = '#5a4936'; ctx.fillRect(sx, sy + 5, T, 1); ctx.fillRect(sx, sy + 11, T, 1);
    ctx.fillStyle = '#7a6650'; ctx.fillRect(sx + ((h * 13) | 0), sy + 2, 3, 1);
    if (t === 8) { ctx.fillStyle = '#5a3a18'; ctx.fillRect(sx + 1, sy + 1, 14, 14); ctx.fillStyle = '#9a6a30'; ctx.fillRect(sx + 2, sy + 2, 12, 12); ctx.fillStyle = '#7a5020'; ctx.fillRect(sx + 2, sy + 7, 12, 2); ctx.fillRect(sx + 7, sy + 2, 2, 12); }

    ctx.fillStyle = '#3a3a48'; ctx.fillRect(sx, sy + 8, T, 1); ctx.fillRect(sx + 5 + (ty % 2) * 4, sy + 5, 1, 3);

    ctx.fillStyle = '#6a4220'; ctx.fillRect(sx + 7, sy + 1, 2, 15); ctx.fillStyle = '#e8c050'; ctx.fillRect(sx + 11, sy + 8, 2, 2);

function drawPlayer(p, x, y, isMe) {
  const bob = p.mv ? Math.abs(Math.sin(p.bob || 0)) * 1.5 : 0, st = p.mv ? Math.sin(p.bob || 0) * 2 : 0;
  ctx.fillStyle = '#00000066'; ctx.fillRect(x - 4, y + 4, 9, 3);

  ctx.fillStyle = isMe ? '#b07a20' : '#356a9a'; ctx.fillRect(x - 4, y, 8, 2);
  ctx.fillStyle = '#e8cfa8'; ctx.fillRect(x - 3, y - 11, 6, 5);

  ctx.fillRect(x - 10, y - 12 + j, 3, 17); ctx.fillRect(x + 7, y - 12 - j, 3, 17);
  ctx.fillRect(x - 4, y + 6, 3, 6); ctx.fillRect(x + 1, y + 6, 3, 6);
  ctx.fillStyle = '#4a4a66'; ctx.fillRect(x - 4, y - 14, 1, 20); ctx.fillRect(x - 10, y - 12 + j, 1, 17); ctx.fillRect(x + 9, y - 12 - j, 1, 17);

function drawScare() {
